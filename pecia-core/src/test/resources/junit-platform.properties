# jqwik settings. Properties fix their seed through PropertySeeds, because jqwik has no global seed setting.
# Keep the failure database out of the source tree.
jqwik.database = target/jqwik-database
# Properties declare their seed on purpose, so do not warn about it.
jqwik.seeds.whenfixed = ALLOW
# Print reports only for failures; a failure report includes the seed and the shrunk sample.
jqwik.reporting.onlyfailures = true
# Bound the run time; a property that needs more tries declares them.
jqwik.tries.default = 200
