apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  # Raise during sales; the database pool allows up to six replicas.
  replicas: 3
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: registry.quillmoor.example/orders:2026.06.2
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
