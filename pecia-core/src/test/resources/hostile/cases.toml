# Hostile queries. Each case searches a project whose only file contains the text in HostileInputCorpusTest.
# The query is given literally, or generated as `repeat` written `times` times joined by `separator`. limit defaults
# to 10. An accepted case expects the exact hit count and an unchanged index; a rejected case expects an
# IllegalArgumentException containing the message, raised before the index is opened.

[[query]]
id = "operator-and"
query = "payment AND validation"
outcome = "accepted"
hits = 0
description = "FTS AND is the literal word 'and', which the project text lacks."

[[query]]
id = "operator-or"
query = "payment OR missing"
outcome = "accepted"
hits = 0
description = "FTS OR is literal; every word must match, and 'missing' does not."

[[query]]
id = "operator-not"
query = "payment NOT validation"
outcome = "accepted"
hits = 1
description = "FTS NOT is the literal word 'not', which the project text contains."

[[query]]
id = "near-function"
query = "NEAR(payment validation)"
outcome = "accepted"
hits = 0
description = "NEAR() is literal text; 'near payment' is not a phrase in the project text."

[[query]]
id = "quoted-phrase"
query = "\"quoted text\""
outcome = "accepted"
hits = 1
description = "Quotes are punctuation around literal words."

[[query]]
id = "unbalanced-quote"
query = "\"payment"
outcome = "accepted"
hits = 1
description = "An unbalanced quote is punctuation."

[[query]]
id = "prefix-star"
query = "pay*"
outcome = "accepted"
hits = 0
description = "A trailing star does not request a prefix match."

[[query]]
id = "column-filter"
query = "content:payment"
outcome = "accepted"
hits = 0
description = "A column filter is literal text."

[[query]]
id = "column-filter-source-path"
query = "source_path:payment"
outcome = "accepted"
hits = 0
description = "A filter on another column is literal text."

[[query]]
id = "column-set-filter"
query = "{content source_path}: payment"
outcome = "accepted"
hits = 0
description = "A column-set filter is literal text."

[[query]]
id = "initial-token-caret"
query = "^payment"
outcome = "accepted"
hits = 1
description = "A caret is punctuation, not an initial-token query."

[[query]]
id = "open-parenthesis"
query = "("
outcome = "accepted"
hits = 0
description = "A lone parenthesis leaves nothing to search."

[[query]]
id = "unbalanced-parenthesis"
query = "(payment validation"
outcome = "accepted"
hits = 1
description = "An unbalanced parenthesis is punctuation."

[[query]]
id = "sql-injection"
query = "payment'; DROP TABLE files; --"
outcome = "accepted"
hits = 0
description = "SQL text is bound as a parameter and matched literally."

[[query]]
id = "mixed-case"
query = "PAYMENT Validation"
outcome = "accepted"
hits = 1
description = "Matching ignores case."

[[query]]
id = "no-break-space"
query = "payment\u00A0validation"
outcome = "accepted"
hits = 1
description = "A no-break space separates words."

[[query]]
id = "hyphenated"
query = "payment-validation"
outcome = "accepted"
hits = 1
description = "A hyphen separates words, not a NOT operator."

[[query]]
id = "punctuation-only"
query = "!!! ??? ---"
outcome = "accepted"
hits = 0
description = "No searchable words remain."

[[query]]
id = "empty"
query = ""
outcome = "rejected"
message = "query must not be blank"
description = "An empty query."

[[query]]
id = "whitespace-only"
query = " \t\n"
outcome = "rejected"
message = "query must not be blank"
description = "Whitespace only."

[[query]]
id = "nul"
query = "pay\u0000ment"
outcome = "rejected"
message = "query must not contain NUL"
description = "A NUL character."

[[query]]
id = "max-code-points"
repeat = "x"
times = 4096
outcome = "accepted"
hits = 0
description = "4096 code points, the maximum."

[[query]]
id = "over-code-points"
repeat = "x"
times = 4097
outcome = "rejected"
message = "query must contain at most 4096 code points"
description = "One code point over the maximum."

[[query]]
id = "max-supplementary-code-points"
repeat = "\U0001F600"
times = 4096
outcome = "accepted"
hits = 0
description = "4096 emoji: the limit counts code points, not UTF-16 units."

[[query]]
id = "over-supplementary-code-points"
repeat = "\U0001F600"
times = 4097
outcome = "rejected"
message = "query must contain at most 4096 code points"
description = "4097 emoji."

[[query]]
id = "max-parts"
repeat = "w"
times = 64
separator = " "
outcome = "accepted"
hits = 0
description = "64 query parts, the maximum."

[[query]]
id = "over-parts"
repeat = "w"
times = 65
separator = " "
outcome = "rejected"
message = "query must contain at most 64 raw parts"
description = "One part over the maximum."

[[query]]
id = "over-punctuation-parts"
repeat = "-"
times = 65
separator = " "
outcome = "rejected"
message = "query must contain at most 64 raw parts"
description = "Punctuation-only parts still count toward the limit."

[[query]]
id = "limit-1"
query = "payment validation"
limit = 1
outcome = "accepted"
hits = 1
description = "The smallest limit."

[[query]]
id = "limit-100"
query = "payment validation"
limit = 100
outcome = "accepted"
hits = 1
description = "The largest limit."

[[query]]
id = "limit-0"
query = "payment"
limit = 0
outcome = "rejected"
message = "limit must be between 1 and 100"
description = "A zero limit."

[[query]]
id = "limit-101"
query = "payment"
limit = 101
outcome = "rejected"
message = "limit must be between 1 and 100"
description = "One above the largest limit."

[[query]]
id = "limit-negative"
query = "payment"
limit = -1
outcome = "rejected"
message = "limit must be between 1 and 100"
description = "A negative limit."

# Hostile index storage. Each case places a database at the default index path of a project, queries it, then
# indexes it. A "fixture" source derives the copy from the current-version legacy fixture with the named damage;
# other sources are generated by HostileInputCorpusTest. query is the QueryException reason. indexing is COMPLETE
# when indexing initializes the file, IOException when the index path is rejected before storage opens, and
# otherwise the IndexAccessException reason of the FAILED run. A rejected database must keep its exact bytes.

[[storage]]
id = "truncated"
source = "fixture"
damage = "TRUNCATED"
query = "CORRUPT_INDEX"
indexing = "CORRUPT_INDEX"
description = "The current-version fixture cut in the middle of its third page."

[[storage]]
id = "foreign-project"
source = "fixture"
damage = "FOREIGN_PROJECT"
query = "WRONG_PROJECT"
indexing = "WRONG_PROJECT"
description = "The fixture's stored project root names a sibling project."

[[storage]]
id = "future-schema"
source = "fixture"
damage = "FUTURE_SCHEMA"
query = "INCOMPATIBLE_INDEX"
indexing = "INCOMPATIBLE"
description = "The fixture's schema version is one above the supported version."

[[storage]]
id = "format-mismatch"
source = "fixture"
damage = "FORMAT_MISMATCH"
query = "INCOMPATIBLE_INDEX"
indexing = "INCOMPATIBLE"
description = "The fixture's index format version disagrees with its schema version."

[[storage]]
id = "text-file"
source = "text-file"
query = "CORRUPT_INDEX"
indexing = "CORRUPT_INDEX"
description = "A plain text file at the index path."

[[storage]]
id = "header-only"
source = "header-only"
query = "CORRUPT_INDEX"
indexing = "CORRUPT_INDEX"
description = "A SQLite header padded to 100 bytes with no pages."

[[storage]]
id = "empty-file"
source = "empty-file"
query = "INDEX_NOT_FOUND"
indexing = "COMPLETE"
description = "A zero-byte file, as an interrupted first run can leave."

[[storage]]
id = "empty-database"
source = "empty-database"
query = "INDEX_NOT_FOUND"
indexing = "COMPLETE"
description = "A SQLite database with a header and no schema objects."

[[storage]]
id = "foreign-database"
source = "foreign-database"
query = "INCOMPATIBLE_INDEX"
indexing = "INCOMPATIBLE"
description = "Another application's unversioned SQLite database."

[[storage]]
id = "directory"
source = "directory"
query = "READ_FAILED"
indexing = "IOException"
description = "A directory at the index path."
