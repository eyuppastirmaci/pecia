# Modules run one after another: with parallel projects, palantir-java-format (run by Spotless) intermittently failed
# with NoClassDefFoundError. Each test task still runs its classes in several JVMs (see the test convention).
org.gradle.parallel=false
# Reuse the outputs of tasks whose inputs have not changed, test results included. referenceTest is never reused,
# because the model it checks lives outside the build.
org.gradle.caching=true
