[versions]
junit = "5.11.4"
# 1.9.2 is the newest jqwik release built against JUnit Platform 1.11.
jqwik = "1.9.2"
palantir-java-format = "2.98.0"
picocli = "4.7.7"
shadow = "9.6.1"
spotless = "8.10.3"

[libraries]
commonmark = { module = "org.commonmark:commonmark", version = "0.27.1" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version = "7.3.0.202506031305-r" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "1.7.36" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.53.4.0" }
tomlj = { module = "org.tomlj:tomlj", version = "1.1.1" }

# The BOM aligns every JUnit Platform module, including those that jqwik brings in.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }

# Gradle plugins applied by the convention plugins in build-logic.
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
