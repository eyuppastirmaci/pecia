name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # Superseded pull request runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Validates the wrapper JAR and caches Gradle's downloads between runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify (Linux and macOS)
        if: runner.os != 'Windows'
        run: ./gradlew check

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  core-verify:
    name: core-verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Proves the core library builds and passes its packaged tests without running any CLI task.
      - name: Verify core independently
        run: ./gradlew :pecia-core:check
