name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # Superseded pull request runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify (Linux)
        if: runner.os == 'Linux'
        run: bash ./mvnw -B -ntp verify

      # macOS resolves /var through a symbolic link, which path-validation tests reject.
      - name: Verify (macOS)
        if: runner.os == 'macOS'
        run: bash ./mvnw -B -ntp -DargLine=-Djava.io.tmpdir=/private/tmp verify

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  core-verify:
    name: core-verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Proves the core library builds and passes its packaged tests without the CLI module.
      - name: Verify core independently
        run: bash ./mvnw -B -ntp -pl pecia-core -am verify
