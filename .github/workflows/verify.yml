name: Verify

on:
  push:
    # experiment/ branches measure candidate changes without a pull request.
    branches: [main, 'experiment/**']
  pull_request:
    branches: [main]
  # Lets an experiment branch run the same checks without opening a pull request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # Superseded pull request runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Validates the wrapper JAR and caches Gradle's downloads between runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify (Linux and macOS)
        if: runner.os != 'Windows'
        run: ./gradlew check --profile

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        # The default temporary directory is on C:, which is slower than the workspace drive (D:) for the tests' many
        # small SQLite writes; the build passes this directory on to every test JVM.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: .\gradlew.bat check --profile

      # Only the next three steps use the real model, comparing its embeddings with the committed sentence-transformers
      # references. A cache miss downloads it through the packaged CLI, which verifies its SHA-256; the test tasks above
      # never download it.
      - name: Restore the semantic model
        id: semantic-model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pecia-cache/models
          # SemanticModel.java holds the pinned revision and SHA-256, so any change to the pin starts a new cache.
          key: semantic-model-${{ hashFiles('pecia-core/src/main/java/dev/eyuppastirmaci/pecia/semantic/SemanticModel.java') }}

      - name: Download the semantic model
        if: steps.semantic-model.outputs.cache-hit != 'true'
        shell: bash
        env:
          PECIA_CACHE_DIR: ${{ runner.temp }}/pecia-cache
        run: |
          project="$RUNNER_TEMP/semantic-model-download"
          mkdir -p "$project"
          echo "Downloads the semantic model." > "$project/readme.md"
          java -jar pecia-cli/build/libs/pecia.jar index --semantic "$project"

      - name: Compare embeddings with the references
        env:
          PECIA_CACHE_DIR: ${{ runner.temp }}/pecia-cache
        run: ${{ runner.os == 'Windows' && '.\gradlew.bat' || './gradlew' }} referenceTest

      # Test results and Gradle's profile report from every run, so timings can be compared between runs. Artifact names
      # include the attempt, because a re-run cannot upload an artifact name that its run already has.
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            **/build/test-results/**/*.xml
            build/reports/profile/
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  core-verify:
    name: core-verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Proves the core library builds and passes its packaged tests without running any CLI task.
      - name: Verify core independently
        run: ./gradlew :pecia-core:check --profile

      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-core-verify-attempt-${{ github.run_attempt }}
          path: |
            **/build/test-results/**/*.xml
            build/reports/profile/
          retention-days: 7
